[package]
authors = ["Harness Labs"]
edition = "2024"
name    = "arbiter-core"
version = "0.1.0"

[dependencies]
serde        = { version = "1.0", features = ["derive"] }
thiserror    = { version = "2.0" }
tokio        = { workspace = true }
tokio-stream = { version = "0.1" }
tracing      = { version = "0.1" }
# TODO: we should have a generic serialization strategy trait
serde_json = { version = "1.0" }

[dev-dependencies]
arbiter-core = { path = ".", features = ["fixtures"] }
tokio        = { workspace = true }
tracing-test = { version = "0.2" }

[features]
default   = ["in-memory"]
fixtures  = []
in-memory = []
tcp       = []
