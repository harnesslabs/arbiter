[package]
authors = ["Harness Labs"]
edition = "2024"
name    = "arbiter-core"
version = "0.1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { workspace = true, features = ["io-util", "net"] }
# TODO: we should have a generic serialization strategy trait
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }

[dev-dependencies]
tokio        = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }
tracing-test = { version = "0.2" }

[features]
default   = ["in-memory"]
fixtures  = []
in-memory = []
replay    = []
tcp       = []
