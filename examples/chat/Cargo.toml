[package]
edition = "2024"
name    = "chat"
publish = false
version = "0.1.0"

[dependencies]
arbiter = { workspace = true, features = ["tcp"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[example]]
name = "chat"
path = "src/main.rs"
