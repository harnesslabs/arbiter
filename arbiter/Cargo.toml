[package]
name = "arbiter"

authors    = ["Harness Labs"]
edition    = "2024"
keywords   = ["actor", "agent", "framework", "distributed", "network"]
license    = "AGPL-3.0"
readme     = "README.md"
repository = "https://github.com/harnesslabs/arbiter"
version    = "0.5.0"

[dependencies]
# Runtime
tokio = { version = "1.49", default-features = false, features = [
  "rt",
  "macros",
] }
tokio-stream = { version = "0.1" }
tokio_with_wasm = { version = "0.9.0", optional = true, features = [
  "rt",
  "macros",
] }

# Errors / Logging
thiserror = { version = "2.0" }
tracing   = { version = "0.1" }

[dev-dependencies]
tracing-test = { version = "0.2" }

[features]
default         = ["in-memory"]
fixtures        = []
in-memory       = []
tcp             = []
tokio_with_wasm = ["dep:tokio_with_wasm"]
wasm            = ["tokio_with_wasm"]
